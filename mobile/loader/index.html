<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>1min AI Client - Starting...</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --fg: #e6e8ec;
        --muted: #9aa3b2;
        --accent: #3b82f6;
        --err: #ef4444;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .loader-card {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 18px;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted);
      }
      .error-box {
        display: none;
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fecaca;
        font-size: 12px;
        text-align: left;
        word-break: break-word;
      }
      .error-box.is-visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="loader-card">
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <h1 id="statusTitle">1min AI Client</h1>
      <p id="statusMessage">ローカル AI サーバーを起動しています...</p>
      <div id="errorBox" class="error-box" role="alert"></div>
    </main>
    <script>
      window.__showStartupError = function (message) {
        var spinner = document.getElementById('spinner');
        var title = document.getElementById('statusTitle');
        var statusMessage = document.getElementById('statusMessage');
        var errorBox = document.getElementById('errorBox');
        if (spinner) spinner.style.display = 'none';
        if (title) title.textContent = '起動に失敗しました';
        if (statusMessage) statusMessage.textContent = 'ローカル BFF サーバーを初期化できませんでした。';
        if (errorBox) {
          errorBox.textContent = String(message || 'Unknown startup error');
          errorBox.classList.add('is-visible');
        }
      };
    </script>
  </body>
</html>
